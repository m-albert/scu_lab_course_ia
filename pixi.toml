[workspace]
name = "labcourse-ia"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
requires-pixi = ">=0.67"

[dependencies]
python = "3.11.*"
pip = "*"
jupyterlab = "*"
ipykernel = "*"
matplotlib = ">=3.9.2,<4.0.0"
scipy = ">=1.14.0,<2.0.0"
scikit-image = ">=0.24.0,<0.25.0"
seaborn = "*"
pandas = ">=2.2.2,<3.0.0"
ipympl = "*"
tqdm = "*"
stackview = "*"
pytest = "*"
cellpose = "<4"
nd2 = "*"
pyimagej = "*"
openjdk = "11.*"
maven = "*"
pillow = ">=10.4.0,<11.0.0"
h5py = ">=3.11.0,<4.0.0"
imagecodecs = ">=2024.6.1,<2025.0.0"
ipython = ">=8.26.0,<9.0.0"
natsort = ">=8.4.0,<9.0.0"
nd2reader = ">=3.3.0,<4.0.0"
notebook = ">=7.2.1,<8.0.0"
numpy = "<2.0.0"
opencv = ">=4.10.0,<5.0.0"
pyarrow = ">=17.0.0,<18.0.0"
pystackreg = ">=0.2.7,<0.3.0"
requests = ">=2.32.3,<3.0.0"
scikit-learn = ">=1.5.1,<2.0.0"
tifffile = ">=2024.7.24,<2025.0.0"

[pypi-options]
extra-index-urls = ["https://ia-res.ethz.ch/pypi"]

[pypi-dependencies]
iaf = "==0.5.0"

[tasks]
test = "pytest notebooks/tests/test_imports.py"

[feature.docs.dependencies]
python = "3.11.*"
jupyter-book = "<2"

[feature.docs.tasks]
book-clean = "jupyter-book clean . --all"
book = "jupyter-book build . --config _config.yml --toc _toc.yml --all"

[environments]
docs = { features = ["docs"], no-default-feature = true }
